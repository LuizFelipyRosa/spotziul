name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - run: npm install
      - run: npx cap add android
      - name: Icone do app
        run: |
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          src = Image.open('icon.png').convert('RGBA')
          res = 'android/app/src/main/res'
          def sq(img, frac):
              w = img.size[0]; m = int(w * frac); o = (w - m) // 2
              return img.crop((o, o, o + m, o + m))
          for d, a, f in [('mdpi', 48, 108), ('hdpi', 72, 162), ('xhdpi', 96, 216), ('xxhdpi', 144, 324), ('xxxhdpi', 192, 432)]:
              folder = f'{res}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              m = Image.new('L', (a, a), 0)
              ImageDraw.Draw(m).rounded_rectangle((0, 0, a - 1, a - 1), radius=int(a * .22), fill=255)
              o = Image.new('RGBA', (a, a), (0, 0, 0, 0))
              o.paste(sq(src, .88).resize((a, a), Image.LANCZOS), (0, 0), m)
              o.save(f'{folder}/ic_launcher.png')
              m = Image.new('L', (a, a), 0)
              ImageDraw.Draw(m).ellipse((0, 0, a - 1, a - 1), fill=255)
              o = Image.new('RGBA', (a, a), (0, 0, 0, 0))
              o.paste(sq(src, .8).resize((a, a), Image.LANCZOS), (0, 0), m)
              o.save(f'{folder}/ic_launcher_round.png')
              src.resize((f, f), Image.LANCZOS).save(f'{folder}/spotziul_fg.png')
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          os.makedirs(f'{res}/values', exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n<background android:drawable="@color/spotziul_icon_bg"/>\n<foreground android:drawable="@mipmap/spotziul_fg"/>\n</adaptive-icon>\n'
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(f'{res}/mipmap-anydpi-v26/{n}.xml', 'w').write(xml)
          open(f'{res}/values/spotziul_colors.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n<color name="spotziul_icon_bg">#6A2F9E</color>\n</resources>\n')
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spotziul-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

