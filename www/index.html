<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Player</title>
<style>
:root{--bg:#121212;--hi:#2a2a2a;--tx:#fff;--mu:#b3b3b3;--ac:#1ed760;--tint:#3b2a5c}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px}
h1{font-size:26px;margin-bottom:12px}
h2{font-size:22px;margin:26px 0 12px}
.sub{color:var(--mu);font-size:13px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;overflow-x:auto}
.me{flex:0 0 44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#e8590c,#7c3aed);display:grid;place-items:center;font-weight:700;font-size:18px}
.chip{flex:0 0 auto;padding:10px 18px;border-radius:24px;background:var(--hi);font-size:15px}
.chip.on{background:var(--ac);color:#000;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{display:flex;align-items:center;background:var(--hi);border-radius:6px;overflow:hidden;height:56px;cursor:pointer}
.q .art{width:56px;height:56px;flex:none;border-radius:0}
.q b{padding:0 10px;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.big{flex:0 0 150px;cursor:pointer}
.big .art{width:150px;height:150px}
.big p{margin-top:8px;font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.big small{display:block;color:var(--mu);font-size:12px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.art{position:relative;display:grid;place-items:center;border-radius:6px;overflow:hidden;color:rgba(255,255,255,.6);font-size:24px;background:var(--c,#333)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item{display:flex;align-items:center;gap:12px;padding:7px 0;cursor:pointer}
.item .art{width:48px;height:48px;flex:none}
.item.r .art{border-radius:50%}
.item>div{flex:1;min-width:0}
.item b,.item span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item b{font-weight:600;font-size:15px}
.item span{color:var(--mu);font-size:13px}
.item.on b{color:var(--ac)}
.dots{padding:8px 4px;color:var(--mu);font-size:22px;line-height:1}
input[type=text],input[type=password]{width:100%;padding:13px 14px;border-radius:8px;border:0;background:var(--hi);color:var(--tx);font-size:16px;margin-bottom:12px}
.btn{background:var(--ac);color:#000;font-weight:700;padding:12px 26px;border-radius:30px}
.btn.alt{background:var(--hi);color:var(--tx)}
.acts{display:flex;gap:10px;margin:4px 0 12px}
.back{padding:0 8px 10px 0}
.head{display:flex;gap:16px;align-items:flex-end;margin-bottom:12px}
.head .art{width:130px;height:130px;flex:none}
.head h1{font-size:22px;margin:0 0 4px}
.empty{text-align:center;padding:60px 16px}
.empty h1{font-size:22px}
.empty .btn{margin-top:18px}
#mini{display:flex;align-items:center;gap:10px;margin:0 8px 6px;padding:8px 10px;background:var(--tint);border-radius:8px;cursor:pointer;position:relative;overflow:hidden;transition:background .4s}
#mart .art{width:42px;height:42px;border-radius:4px}
#mini .t{flex:1;min-width:0}
#mini b,#mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini b{font-size:14px}
#mini span{font-size:12px;color:rgba(255,255,255,.7)}
#mpp svg{width:30px;height:30px}
#mbar{position:absolute;left:10px;right:10px;bottom:2px;height:2px;background:rgba(255,255,255,.25)}
#mbar i{display:block;height:100%;width:0;background:#fff}
nav{display:flex;padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(rgba(18,18,18,0),rgba(18,18,18,.96) 35%)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px;color:var(--mu);font-size:12px}
nav button.act{color:var(--tx)}
#full{position:fixed;inset:0;background:linear-gradient(var(--tint),var(--bg) 78%);display:flex;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 26px calc(26px + env(safe-area-inset-bottom,0px));z-index:5}
#full[hidden],#mini[hidden],#sheet[hidden],#toast[hidden]{display:none}
#close{align-self:flex-start;padding:6px}
#fartbox{width:100%;max-width:340px;margin:auto 0 26px}
#fartbox .art{width:100%;aspect-ratio:1;font-size:90px;border-radius:8px}
.tt{display:flex;align-items:center;gap:12px;width:100%;max-width:340px}
.tt>div{flex:1;min-width:0}
#ft{font-size:21px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fa{font-size:15px}
#fav svg{width:28px;height:28px}
#seek{width:100%;max-width:340px;margin-top:16px;accent-color:var(--ac)}
.times{display:flex;justify-content:space-between;width:100%;max-width:340px;color:var(--mu);font-size:12px}
.ctl{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:340px;margin:12px 0 auto}
.ctl button{padding:8px;color:var(--mu);display:flex;align-items:center;gap:2px;font-size:12px}
.ctl .on{color:var(--ac)}
.ctl .m{color:var(--tx)}
.ctl .m svg{width:34px;height:34px}
#pp{width:64px;height:64px;border-radius:50%;background:#fff;color:#000;justify-content:center}
#pp svg{width:30px;height:30px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:8}
#sheet .box{width:100%;background:#262626;border-radius:16px 16px 0 0;padding:18px 20px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
#sheet button{text-align:left;padding:14px 0;font-size:16px}
#sheet .red{color:#ff6b6b}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9;max-width:85%;text-align:center}
#serr{color:#ff6b6b;font-size:14px;min-height:20px;margin-bottom:10px}
button.me{padding:0;color:#fff}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <div id="mini" hidden>
    <div id="mart"></div>
    <div class="t"><b id="mt"></b><span id="ma"></span></div>
    <button id="mpp" aria-label="Tocar ou pausar"></button>
    <div id="mbar"><i></i></div>
  </div>
  <nav>
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>Início</button>
    <button data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Buscar</button>
    <button data-tab="lib"><svg viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 5l5 14"/></svg>Biblioteca</button>
    <button id="addb"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Adicionar</button>
  </nav>
</div>
<div id="full" hidden>
  <button id="close" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  <div id="fartbox"></div>
  <div class="tt"><div><h2 id="ft"></h2><p class="sub" id="fa"></p></div><button id="fav" aria-label="Curtir"></button></div>
  <input type="range" id="seek" min="0" max="100" value="0" step="1">
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button id="shuf" aria-label="Aleatório"></button>
    <button id="prev" class="m" aria-label="Anterior"></button>
    <button id="pp" aria-label="Tocar ou pausar"></button>
    <button id="next" class="m" aria-label="Próxima"></button>
    <button id="rep" aria-label="Repetir"></button>
  </div>
</div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="file" accept="audio/*" multiple hidden>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const byTitle=(a,b)=>norm(a.title).localeCompare(norm(b.title));

/*MD5*/
function md5(s){
  const k=new Int32Array(64),r=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];
  for(let i=0;i<64;i++)k[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0;
  const b=new TextEncoder().encode(s),n=b.length,len=((n+8>>6)+1)<<4,w=new Int32Array(len);
  for(let i=0;i<n;i++)w[i>>2]|=b[i]<<((i%4)*8);
  w[n>>2]|=0x80<<((n%4)*8);w[len-2]=n*8;
  let a0=0x67452301,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476;
  for(let o=0;o<len;o+=16){
    let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){
      let f,g;
      if(i<16){f=(B&C)|(~B&D);g=i}
      else if(i<32){f=(D&B)|(~D&C);g=(5*i+1)%16}
      else if(i<48){f=B^C^D;g=(3*i+5)%16}
      else{f=C^(B|~D);g=(7*i)%16}
      const t=D;D=C;C=B;
      const x=(A+f+k[i]+w[o+g])|0,sh=r[(i>>4)*4+(i%4)];
      B=(B+((x<<sh)|(x>>>(32-sh))))|0;A=t;
    }
    a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0;
  }
  const h=v=>[0,8,16,24].map(q=>((v>>>q)&255).toString(16).padStart(2,'0')).join('');
  return h(a0)+h(b0)+h(c0)+h(d0);
}
/*ENDMD5*/

/* ---------- Servidor (Navidrome / Subsonic) ---------- */
let cfg=null;
try{cfg=JSON.parse(localStorage.getItem('cfg'))}catch(e){}
const native=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const surl=(ep,p)=>cfg.url+'/rest/'+ep+'?'+new URLSearchParams(Object.assign({u:cfg.user,t:cfg.token,s:cfg.salt,v:'1.16.1',c:'MeuPlayer',f:'json'},p));
async function api(ep,p){
  const r=await fetch(surl(ep,p));
  const j=(await r.json())['subsonic-response'];
  if(j.status!=='ok')throw new Error(j.error?j.error.message:'Erro no servidor');
  return j;
}
const toSong=s=>({id:'srv:'+s.id,sid:s.id,src:'server',title:s.title||'Sem título',artist:s.artist||'Artista desconhecido',album:s.album||'Sem álbum',track:s.track||0,duration:s.duration||0,coverArt:s.coverArt||null,suffix:s.suffix||'mp3',cover:null,added:Date.parse(s.created)||Date.now(),plays:0,last:0,fav:false});
async function fetchAll(){
  let got=[];
  for(let o=0;;o+=500){
    const r=await api('search3',{query:'',songCount:500,songOffset:o,artistCount:0,albumCount:0});
    const l=(r.searchResult3&&r.searchResult3.song)||[];
    got=got.concat(l);
    if(l.length<500)break;
  }
  if(got.length)return got;
  for(let o=0;;o+=100){
    const r=await api('getAlbumList2',{type:'alphabeticalByName',size:100,offset:o});
    const al=(r.albumList2&&r.albumList2.album)||[];
    for(let i=0;i<al.length;i+=8){
      const rs=await Promise.all(al.slice(i,i+8).map(a=>api('getAlbum',{id:a.id})));
      rs.forEach(x=>{got=got.concat(x.album.song||[])});
    }
    if(al.length<100)break;
  }
  return got;
}
async function sync(manual){
  if(!cfg)return;
  toast('Sincronizando…');
  try{
    const got=await fetchAll();
    const old={};songs.filter(s=>s.src==='server').forEach(s=>{old[s.id]=s});
    const fresh=got.map(x=>{const n=toSong(x),o=old[n.id];if(o){n.fav=o.fav;n.plays=o.plays;n.last=o.last;n.added=o.added;if(o.dl)n.dl=o.dl}return n});
    const keep=new Set(fresh.map(s=>s.id));
    const gone=Object.keys(old).filter(id=>!keep.has(id)&&!old[id].dl);
    const kept=Object.values(old).filter(o=>!keep.has(o.id)&&o.dl);
    await tx('songs','readwrite',st=>{fresh.forEach(x=>st.put(x));gone.forEach(id=>st.delete(id))});
    songs=songs.filter(s=>s.src!=='server').concat(fresh,kept);
    localStorage.setItem('lastSync',String(Date.now()));
    toast(fresh.length+' músicas do servidor');
    refresh();
  }catch(e){toast(manual?'Falha ao sincronizar: '+e.message:'Servidor indisponível')}
}
async function connect(){
  let url=$('#su').value.trim().replace(/\/+$/,'');
  if(!/^https?:\/\//.test(url))url='http://'+url;
  const salt=Math.random().toString(36).slice(2,10),old=cfg;
  cfg={url,user:$('#sn').value.trim(),salt,token:md5($('#sp').value+salt)};
  $('#serr').textContent='Conectando…';
  try{
    await api('ping');
    localStorage.setItem('cfg',JSON.stringify(cfg));
    await sync(true);
  }catch(e){
    cfg=old;
    $('#serr').textContent='Não foi possível conectar. Confira endereço, usuário e senha, e se o servidor está ligado. ('+e.message+')';
  }
}
async function disconnect(){
  if(!confirm('Desconectar do servidor? As músicas baixadas continuam no celular.'))return;
  try{localStorage.removeItem('cfg');localStorage.removeItem('lastSync')}catch(e){}
  cfg=null;
  const gone=songs.filter(s=>s.src==='server'&&!s.dl).map(s=>s.id);
  await tx('songs','readwrite',st=>{gone.forEach(id=>st.delete(id))});
  songs=songs.filter(s=>!(s.src==='server'&&!s.dl));
  const c=queue[idx];
  if(c&&c.src==='server'&&!c.dl){audio.pause();audio.removeAttribute('src');queue=[];idx=-1;$('#mini').hidden=true;$('#full').hidden=true}
  render();
}
async function download(s,quiet){
  const say=t=>{if(!quiet)toast(t)};
  if(!native)return toast('Downloads só funcionam no app instalado.');
  const Fs=Capacitor.Plugins.Filesystem;
  if(s.dl){
    try{await Fs.deleteFile({path:s.dl.path,directory:'DATA'})}catch(e){}
    delete s.dl;await save(s);return say('Download removido');
  }
  if(!cfg)return toast('Conecte ao servidor para baixar.');
  say('Baixando '+s.title+'…');
  try{
    const path='music/'+s.sid+'.'+(s.suffix||'mp3');
    await Fs.downloadFile({url:surl('download',{id:s.sid}),path,directory:'DATA',recursive:true});
    s.dl={path,uri:(await Fs.getUri({path,directory:'DATA'})).uri};
    await save(s);say('Baixada: '+s.title);
  }catch(e){toast('Falha ao baixar: '+e.message)}
}
async function dlMany(list){
  const l=list.filter(s=>s.src==='server'&&!s.dl);
  for(let i=0;i<l.length;i++){toast('Baixando '+(i+1)+' de '+l.length+'…');await download(l[i],true)}
  if(l.length)toast(l.length+' música(s) baixada(s)');
  refresh();
}

/* ---------- Armazenamento (IndexedDB) ---------- */
const DB=new Promise((res,rej)=>{
  const r=indexedDB.open('meuplayer',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('songs',{keyPath:'id'});r.result.createObjectStore('files')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});
const tx=async(st,mode,fn)=>{
  const db=await DB;
  return new Promise((res,rej)=>{
    const t=db.transaction(st,mode);const rq=fn(t.objectStore(st));
    t.oncomplete=()=>res(rq&&rq.result);t.onerror=t.onabort=()=>rej(t.error);
  });
};
const save=s=>tx('songs','readwrite',st=>st.put(s));

/* ---------- Leitura de tags ID3 (nome, artista, álbum, capa) ---------- */
/*TAGS*/
const txt=d=>{const e=d[0];const l=e===0?'iso-8859-1':e===3?'utf-8':(e===2||(d[1]===0xFE&&d[2]===0xFF))?'utf-16be':'utf-16le';return new TextDecoder(l).decode(d.subarray(1)).replace(/\0+$/,'').replace(/^\uFEFF/,'').trim()};
async function readTags(f){
  const o={};
  try{
    const h=new Uint8Array(await f.slice(0,10).arrayBuffer());
    if(h[0]!==0x49||h[1]!==0x44||h[2]!==0x33||h[3]<3)return o;
    const ver=h[3],total=(h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9];
    const b=new Uint8Array(await f.slice(10,10+Math.min(total,12e6)).arrayBuffer());
    let p=0;
    while(p+10<=b.length){
      const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);
      if(!/^[A-Z0-9]{4}$/.test(id))break;
      const sz=ver===4?(b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7]:b[p+4]*16777216+(b[p+5]<<16)+(b[p+6]<<8)+b[p+7];
      const d=b.subarray(p+10,p+10+sz);p+=10+sz;
      if(!d.length)continue;
      if(id==='TIT2')o.title=txt(d);
      else if(id==='TPE1')o.artist=txt(d);
      else if(id==='TALB')o.album=txt(d);
      else if(id==='TRCK')o.track=parseInt(txt(d))||0;
      else if(id==='APIC'&&!o.cover){
        let q=1;while(q<d.length&&d[q])q++;
        const mime=String.fromCharCode(...d.subarray(1,q));q+=2;
        if(d[0]===1||d[0]===2){while(q+1<d.length&&(d[q]||d[q+1]))q+=2;q+=2}else{while(q<d.length&&d[q])q++;q++}
        o.cover=new Blob([d.subarray(q)],{type:mime.indexOf('/')>0?mime:'image/jpeg'});
      }
    }
  }catch(e){}
  return o;
}
/*ENDTAGS*/
const getDur=f=>new Promise(r=>{
  const a=new Audio(),u=URL.createObjectURL(f);
  a.preload='metadata';
  a.onloadedmetadata=()=>{r(isFinite(a.duration)?a.duration:0);URL.revokeObjectURL(u)};
  a.onerror=()=>{r(0);URL.revokeObjectURL(u)};
  a.src=u;
});

/* ---------- Estado ---------- */
let songs=[],queue=[],idx=-1,lists={},cur={v:'home'},hist=[],root='home',chip='Tudo',libChip='Músicas',shuf=false,rep=0,curUrl='',loadId=0,tt;
const L=(n,a)=>(lists[n]=a);
const audio=new Audio();
const urls={};
const cu=s=>s.cover?(urls[s.id]||(urls[s.id]=URL.createObjectURL(s.cover))):(s.coverArt&&cfg?surl('getCoverArt',{id:s.coverArt,size:300}):'');
const art=s=>`<span class="art" style="--c:hsl(${hue(s.album||s.title)},40%,28%)">♪${cu(s)?`<img loading="lazy" src="${cu(s)}" alt="" onerror="this.remove()">`:''}</span>`;
const mk=(c,b)=>`<span class="art" style="--c:${c}">${b}</span>`;

const IC={
  play:'<svg class="f" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg class="f" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  next:'<svg class="f" viewBox="0 0 24 24"><path d="M6 5l9 7-9 7zM17 5h2v14h-2z"/></svg>',
  prev:'<svg class="f" viewBox="0 0 24 24"><path d="M18 5l-9 7 9 7zM5 5h2v14H5z"/></svg>',
  shuf:'<svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  rep:'<svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>',
  heart:f=>`<svg viewBox="0 0 24 24" style="${f?'fill:var(--ac);stroke:var(--ac)':''}"><path d="M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"/></svg>`
};
$('#prev').innerHTML=IC.prev;$('#next').innerHTML=IC.next;$('#shuf').innerHTML=IC.shuf;

/* ---------- Navegação ---------- */
const tab=v=>{root=v;hist=[];cur={v};render()};
const go=(v,k)=>{hist.push(cur);cur={v,k};render()};
const back=()=>{cur=hist.pop()||{v:root};render()};
document.querySelectorAll('nav [data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$('#addb').onclick=()=>$('#file').click();

/* ---------- Telas ---------- */
function albums(){
  const m={};
  songs.forEach(s=>{const k=s.album+'|'+s.artist;(m[k]=m[k]||{key:k,name:s.album,artist:s.artist,songs:[]}).songs.push(s)});
  return Object.values(m).sort((a,b)=>norm(a.name).localeCompare(norm(b.name)));
}
const alArt=a=>a.songs.find(s=>s.cover)||a.songs[0];
const alRow=a=>`<div class="item" data-go="album" data-k="${esc(a.key)}">${art(alArt(a))}<div><b>${esc(a.name)}</b><span>Álbum · ${esc(a.artist)}</span></div></div>`;
const row=(s,i,l)=>`<div class="item${queue[idx]&&queue[idx].id===s.id?' on':''}" data-l="${l}" data-i="${i}">${art(s)}<div><b>${esc(s.title)}</b><span>${s.dl?'⬇ ':''}${esc(s.artist)}${s.duration?' · '+fmt(s.duration):''}</span></div><button class="dots" data-menu="${esc(s.id)}" aria-label="Mais opções">⋮</button></div>`;
const empty=()=>'<div class="empty"><h1>Sua biblioteca está vazia</h1><p class="sub">Adicione músicas do celular ou conecte ao seu servidor para começar a ouvir.</p><div class="acts" style="justify-content:center;flex-wrap:wrap"><button class="btn" data-act="add">Adicionar do celular</button><button class="btn alt" data-act="srv">Conectar ao servidor</button></div></div>';
const backBtn='<button class="back" data-act="back" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>';
const chips=(list,on,attr)=>list.map(c=>`<button class="chip${on===c?' on':''}" data-${attr}="${c}">${c}</button>`).join('');

function home(){
  const top='<div class="top"><button class="me" data-go="srv" aria-label="Servidor">M</button>'+chips(['Tudo','Músicas','Álbuns'],chip,'chip')+'</div>';
  if(!songs.length)return top+empty();
  const al=albums(),favs=songs.some(s=>s.fav);
  const recent=songs.filter(s=>s.last).sort((a,b)=>b.last-a.last);
  const added=[...songs].sort((a,b)=>b.added-a.added);
  const albQ=a=>`<div class="q" data-go="album" data-k="${esc(a.key)}">${art(alArt(a))}<b>${esc(a.name)}</b></div>`;
  let quick;
  if(chip==='Músicas'){
    quick=L('q',[...songs].sort((a,b)=>(b.plays||0)-(a.plays||0)||b.added-a.added).slice(0,8)).map((s,i)=>`<div class="q" data-l="q" data-i="${i}">${art(s)}<b>${esc(s.title)}</b></div>`);
  }else{
    quick=[];
    if(chip==='Tudo'){
      if(favs)quick.push(`<div class="q" data-go="favs">${mk('linear-gradient(135deg,#4500e5,#a8c0ff)','♥')}<b>Músicas curtidas</b></div>`);
      quick.push(`<div class="q" data-go="all">${mk('linear-gradient(135deg,#3d3d3d,#8e8e8e)','♫')}<b>Todas as músicas</b></div>`);
    }
    quick=quick.concat(al.slice(0,8-quick.length).map(albQ));
  }
  let h=top+'<div class="grid">'+quick.join('')+'</div>';
  if(chip!=='Álbuns'){
    const rs=L('r',(recent.length?recent:added).slice(0,12));
    h+=`<h2>${recent.length?'Tocadas recentemente':'Adicionadas recentemente'}</h2><div class="row">`+rs.map((s,i)=>`<div class="big" data-l="r" data-i="${i}">${art(s)}<p>${esc(s.title)}</p><small>${esc(s.artist)}</small></div>`).join('')+'</div>';
  }
  if(chip!=='Músicas'){
    h+='<h2>Seus álbuns</h2><div class="row">'+al.map(a=>`<div class="big" data-go="album" data-k="${esc(a.key)}">${art(alArt(a))}<p>${esc(a.name)}</p><small>Álbum · ${esc(a.artist)}</small></div>`).join('')+'</div>';
  }
  return h;
}

function lib(){
  let h='<h1>Sua biblioteca</h1><div class="top">'+chips(['Músicas','Álbuns','Artistas','Curtidas','No celular'],libChip,'lib')+'</div>';
  if(!songs.length)return h+empty();
  if(libChip==='Álbuns')h+=albums().map(alRow).join('');
  else if(libChip==='Artistas'){
    const names=[...new Set(songs.map(s=>s.artist))].sort((a,b)=>norm(a).localeCompare(norm(b)));
    h+=names.map(n=>`<div class="item r" data-go="artist" data-k="${esc(n)}">${art(songs.find(s=>s.artist===n))}<div><b>${esc(n)}</b><span>Artista</span></div></div>`).join('');
  }else{
    const list=L('l',(libChip==='Curtidas'?songs.filter(s=>s.fav):libChip==='No celular'?songs.filter(s=>s.src!=='server'||s.dl):[...songs]).sort(byTitle));
    h+=list.length?list.map((s,i)=>row(s,i,'l')).join(''):'<p class="sub">Nada por aqui ainda.</p>';
  }
  return h;
}

function detail(){
  let t='',sub='',list=[];
  if(cur.v==='album'){
    const a=albums().find(x=>x.key===cur.k);
    if(a){t=a.name;sub=a.artist;list=[...a.songs].sort((x,y)=>(x.track||999)-(y.track||999)||byTitle(x,y))}
  }else if(cur.v==='artist'){t=cur.k;sub='Artista';list=songs.filter(s=>s.artist===cur.k).sort(byTitle)}
  else if(cur.v==='favs'){list=songs.filter(s=>s.fav).sort(byTitle);t='Músicas curtidas';sub=list.length+' músicas'}
  else{list=[...songs].sort(byTitle);t='Todas as músicas';sub=list.length+' músicas'}
  L('l',list);
  return backBtn+`<div class="head">${list[0]?art(list[0]):''}<div><h1>${esc(t)}</h1><span class="sub">${esc(sub)}</span></div></div>`+
    (list.length?'<div class="acts"><button class="btn" data-act="playall">▶ Tocar</button><button class="btn alt" data-act="shuffle">Aleatório</button>'+(native&&list.some(s=>s.src==='server'&&!s.dl)?'<button class="btn alt" data-act="dlall">⬇ Baixar</button>':'')+'</div>':'')+
    (list.length?list.map((s,i)=>row(s,i,'l')).join(''):'<p class="sub">Nada por aqui.</p>');
}

function srvView(){
  let h=backBtn+'<h1>Servidor</h1>';
  if(cfg)h+=`<p class="sub">Conectado a ${esc(cfg.url)} como ${esc(cfg.user)}.</p><p class="sub" style="margin:4px 0 14px">${songs.filter(s=>s.src==='server').length} músicas do servidor na biblioteca.</p><div class="acts"><button class="btn" data-act="sync">Sincronizar agora</button><button class="btn alt" data-act="disc">Desconectar</button></div>`;
  else h+='<p class="sub" style="margin-bottom:14px">Conecte ao seu servidor Navidrome para ouvir por streaming e baixar músicas para ouvir sem internet.</p><input type="text" id="su" placeholder="Endereço: http://192.168.0.10:4533" autocapitalize="off" autocomplete="off"><input type="text" id="sn" placeholder="Usuário" autocapitalize="off" autocomplete="off"><input type="password" id="sp" placeholder="Senha"><div id="serr"></div><button class="btn" data-act="connect">Conectar</button>';
  return h;
}

function doSearch(q){
  q=norm(q.trim());const box=$('#res');
  if(!songs.length){box.innerHTML=empty();return}
  if(!q){box.innerHTML='<p class="sub">Busque pelo que está na sua biblioteca.</p>';return}
  const ss=L('l',songs.filter(s=>norm(s.title+' '+s.artist+' '+s.album).includes(q)).sort(byTitle).slice(0,40));
  const as=albums().filter(a=>norm(a.name+' '+a.artist).includes(q)).slice(0,6);
  box.innerHTML=as.map(alRow).join('')+ss.map((s,i)=>row(s,i,'l')).join('')||'<p class="sub">Nada encontrado.</p>';
}

function render(keep){
  const m=$('#main'),y=keep?m.scrollTop:0;
  lists={};
  document.querySelectorAll('nav [data-tab]').forEach(b=>b.classList.toggle('act',b.dataset.tab===root));
  if(cur.v==='search'){
    m.innerHTML='<h1>Buscar</h1><input type="text" id="q" placeholder="Músicas, álbuns ou artistas" autocomplete="off"><div id="res"></div>';
    $('#q').oninput=e=>doSearch(e.target.value);doSearch('');
  }else m.innerHTML=cur.v==='home'?home():cur.v==='lib'?lib():cur.v==='srv'?srvView():detail();
  m.scrollTop=y;
  ui();
}
const refresh=()=>cur.v==='search'?doSearch($('#q').value):render(true);

$('#main').onclick=e=>{
  const t=e.target.closest('[data-menu],[data-l],[data-go],[data-chip],[data-lib],[data-act]');
  if(!t)return;
  const d=t.dataset;
  if(d.menu)sheet(d.menu);
  else if(d.l)play(lists[d.l],+d.i);
  else if(d.go)go(d.go,d.k);
  else if(d.chip){chip=d.chip;render()}
  else if(d.lib){libChip=d.lib;render()}
  else if(d.act==='back')back();
  else if(d.act==='add')$('#file').click();
  else if(d.act==='srv')go('srv');
  else if(d.act==='connect')connect();
  else if(d.act==='sync')sync(true);
  else if(d.act==='disc')disconnect();
  else if(d.act==='dlall'&&lists.l)dlMany(lists.l);
  else if(d.act==='playall'&&lists.l&&lists.l.length){shuf=false;ctl();play(lists.l,0)}
  else if(d.act==='shuffle'&&lists.l&&lists.l.length){shuf=true;ctl();play(lists.l,Math.floor(Math.random()*lists.l.length))}
};

/* ---------- Menu da música ---------- */
function sheet(id){
  const s=songs.find(x=>x.id===id),sh=$('#sheet');
  if(!s)return;
  sh.innerHTML=`<div class="box"><b>${esc(s.title)}</b><span class="sub">${esc(s.artist)}</span><button data-s="fav">${s.fav?'Remover das curtidas':'Curtir'}</button>${s.src==='server'&&native?`<button data-s="dl">${s.dl?'Remover download':'Baixar para ouvir offline'}</button>`:''}${s.src==='server'?'':'<button data-s="del" class="red">Remover da biblioteca</button>'}<button data-s="x">Cancelar</button></div>`;
  sh.hidden=false;
  sh.onclick=async e=>{
    const a=e.target.dataset.s;
    if(!a&&e.target!==sh)return;
    sh.hidden=true;
    if(a==='fav'){s.fav=!s.fav;await save(s);favIcon();refresh()}
    else if(a==='dl'){await download(s);refresh()}
    else if(a==='del'){await remove(s);refresh();toast('Música removida')}
  };
}
async function remove(s){
  await tx('songs','readwrite',st=>st.delete(s.id));
  await tx('files','readwrite',st=>st.delete(s.id));
  songs=songs.filter(x=>x.id!==s.id);
  if(urls[s.id]){URL.revokeObjectURL(urls[s.id]);delete urls[s.id]}
  const c=queue[idx];
  if(c&&c.id===s.id){audio.pause();audio.removeAttribute('src');queue=[];idx=-1;$('#mini').hidden=true;$('#full').hidden=true}
  else if(c){queue=queue.filter(x=>x.id!==s.id);idx=queue.findIndex(x=>x.id===c.id)}
}

/* ---------- Importar músicas ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2600)}
$('#file').onchange=async e=>{
  const files=[...e.target.files].filter(f=>/^audio\//.test(f.type)||/\.(mp3|m4a|flac|ogg|opus|wav|aac)$/i.test(f.name));
  e.target.value='';
  let n=0;
  for(const f of files){
    toast('Adicionando '+(++n)+' de '+files.length+'…');
    try{
      const tg=await readTags(f);
      const s={id:f.name+'|'+f.size,src:'local',title:tg.title||f.name.replace(/\.[^.]+$/,''),artist:tg.artist||'Artista desconhecido',album:tg.album||'Sem álbum',track:tg.track||0,cover:tg.cover||null,duration:await getDur(f),added:Date.now(),plays:0,last:0,fav:false};
      const old=songs.find(x=>x.id===s.id);
      if(old){s.fav=old.fav;s.plays=old.plays;s.last=old.last}
      await tx('files','readwrite',st=>st.put(f,s.id));
      await save(s);
      songs=songs.filter(x=>x.id!==s.id);songs.push(s);
    }catch(err){toast('Não foi possível adicionar '+f.name)}
  }
  if(files.length){toast(files.length+' música(s) adicionada(s)');if(cur.v!=='search')render(true)}
};

/* ---------- Player ---------- */
function play(list,i){queue=list;idx=i;load()}
async function load(){
  const s=queue[idx];if(!s)return;
  const my=++loadId;
  let src;
  if(s.src==='server'){
    if(s.dl)src=Capacitor.convertFileSrc(s.dl.uri);
    else if(cfg)src=surl('stream',{id:s.sid,format:'raw'});
    else{toast('Conecte ao servidor para ouvir essa música.');return}
  }else{
    const blob=await tx('files','readonly',st=>st.get(s.id));
    if(my!==loadId)return;
    if(!blob){toast('Arquivo não encontrado. Remova e adicione de novo.');return}
    src=URL.createObjectURL(blob);
  }
  if(curUrl){URL.revokeObjectURL(curUrl);curUrl=''}
  if(src.startsWith('blob:'))curUrl=src;
  audio.src=src;audio.play().catch(()=>{});
  s.plays=(s.plays||0)+1;s.last=Date.now();save(s);
  ui();tint(s);
  if('mediaSession' in navigator){
    const u=cu(s);
    navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,album:s.album,artwork:u?[{src:u,sizes:'512x512'}]:[]});
    navigator.mediaSession.setActionHandler('previoustrack',prev);
    navigator.mediaSession.setActionHandler('nexttrack',()=>next());
  }
}
function ui(){
  const s=queue[idx];if(!s)return;
  $('#mini').hidden=false;
  $('#mart').innerHTML=art(s);$('#fartbox').innerHTML=art(s);
  $('#mt').textContent=$('#ft').textContent=s.title;
  $('#ma').textContent=$('#fa').textContent=s.artist;
  favIcon();
  document.querySelectorAll('#main .item[data-l]').forEach(el=>{
    const x=lists[el.dataset.l]&&lists[el.dataset.l][+el.dataset.i];
    el.classList.toggle('on',!!x&&x.id===s.id);
  });
}
function tint(s){
  const r=document.documentElement.style;
  const fb=()=>r.setProperty('--tint','hsl('+hue(s.album||s.title)+',40%,26%)');
  const u=cu(s);
  if(!u){fb();return}
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{
    try{
      const c=document.createElement('canvas');c.width=c.height=1;
      const x=c.getContext('2d');x.drawImage(im,0,0,1,1);
      const d=x.getImageData(0,0,1,1).data;
      r.setProperty('--tint','rgb('+(d[0]*.65|0)+','+(d[1]*.65|0)+','+(d[2]*.65|0)+')');
    }catch(e){fb()}
  };
  im.onerror=fb;im.src=u;
}
function favIcon(){const s=queue[idx];$('#fav').innerHTML=IC.heart(s&&s.fav)}
function ctl(){
  $('#shuf').classList.toggle('on',shuf);
  $('#rep').classList.toggle('on',rep>0);
  $('#rep').innerHTML=IC.rep+(rep===2?'<b>1</b>':'');
}
function next(auto){
  if(!queue.length)return;
  if(auto&&rep===2){audio.currentTime=0;audio.play();return}
  if(shuf&&queue.length>1){let n;do n=Math.floor(Math.random()*queue.length);while(n===idx);idx=n;load();return}
  if(idx<queue.length-1){idx++;load()}
  else if(rep===1){idx=0;load()}
  else audio.pause();
}
function prev(){if(audio.currentTime>3||idx<=0)audio.currentTime=0;else{idx--;load()}}
const toggle=()=>{if(audio.src)audio.paused?audio.play().catch(()=>{}):audio.pause()};
const icon=()=>{$('#mpp').innerHTML=$('#pp').innerHTML=audio.paused?IC.play:IC.pause};
audio.onplay=audio.onpause=icon;
audio.onended=()=>next(true);
audio.onerror=()=>{if(audio.getAttribute('src'))toast('Não foi possível tocar essa música.')};
let seeking=false;
audio.ontimeupdate=()=>{
  if(!audio.duration)return;
  $('#seek').max=Math.floor(audio.duration);
  if(!seeking)$('#seek').value=Math.floor(audio.currentTime);
  $('#cur').textContent=fmt(audio.currentTime);$('#dur').textContent=fmt(audio.duration);
  $('#mbar i').style.width=(audio.currentTime/audio.duration*100)+'%';
};
$('#seek').oninput=e=>{seeking=true;$('#cur').textContent=fmt(e.target.value)};
$('#seek').onchange=e=>{audio.currentTime=+e.target.value;seeking=false};
$('#pp').onclick=toggle;$('#prev').onclick=prev;$('#next').onclick=()=>next();
$('#mpp').onclick=e=>{e.stopPropagation();toggle()};
$('#shuf').onclick=()=>{shuf=!shuf;ctl()};
$('#rep').onclick=()=>{rep=(rep+1)%3;ctl()};
$('#fav').onclick=async()=>{const s=queue[idx];if(!s)return;s.fav=!s.fav;favIcon();await save(s)};
$('#mini').onclick=()=>$('#full').hidden=false;
$('#close').onclick=()=>{$('#full').hidden=true;refresh()};

/* ---------- Início ---------- */
icon();ctl();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
(async()=>{
  try{songs=await tx('songs','readonly',st=>st.getAll())||[]}catch(e){toast('Não foi possível abrir a biblioteca.')}
  render();
  if(cfg&&navigator.onLine&&Date.now()-(+localStorage.getItem('lastSync')||0)>6*36e5)sync();
})();
</script>
</body>
</html>
